<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  /* Светлая тема; тёмная — если в Windows включена тёмная. */
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --card: #ffffff; --text: #1f2328; --text-2: #4b5260; --muted: #7a808c; --line: #e3e6eb;
    --accent: #4f6bed; --accent-hover: #3f5ae0; --accent-soft: rgba(79,107,237,.10); --accent-line: rgba(79,107,237,.45);
    --fill: rgba(79,107,237,.12); --ok: #1f9d55; --danger: #d64545; --danger-soft: rgba(214,69,69,.08);
    --warn: #c98a0b; --gold: #d4a017; --gold-soft: rgba(212,160,23,.12); --chip: #f1f3f6; --scroll: rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c; --card: #202227; --text: #e9eaee; --text-2: #b9bcc5; --muted: #8b8f99; --line: #30333a;
      --accent: #7c8cff; --accent-hover: #8e9bff; --accent-soft: rgba(124,140,255,.14); --accent-line: rgba(124,140,255,.5);
      --fill: rgba(124,140,255,.16); --ok: #4cc38a; --danger: #ef6b6b; --danger-soft: rgba(239,107,107,.12);
      --warn: #e0a93a; --gold: #e3b341; --gold-soft: rgba(227,179,65,.14); --chip: #262830; --scroll: rgba(255,255,255,.16);
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    /* Прокручивается всё окно целиком: отдельная прокрутка у списка под голосованием
       сжималась до пары строк. */
    margin: 0; min-height: 100vh; user-select: none; overflow-y: auto;
    background: var(--bg); color: var(--text); font-size: 14px;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  .head { padding: 22px 22px 2px; }
  .title { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .msg { margin-top: 4px; font-size: 15px; color: var(--text-2); }
  .from { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .from b { color: var(--text); font-weight: 600; }
  .timer { margin: 16px 22px 0; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .timer > div { height: 100%; width: 100%; background: var(--accent); transition: width .25s linear; }
  .left { margin: 6px 22px 0; font-size: 12px; color: var(--muted); }
  .btns { display: flex; gap: 10px; padding: 16px 22px 8px; }
  button {
    flex: 1; border: 1px solid transparent; border-radius: 10px; padding: 11px 0; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 600; transition: background-color .15s, border-color .15s;
  }
  button:disabled { opacity: .45; cursor: default; }
  .acc { background: var(--accent); color: #fff; }
  .acc:hover:not(:disabled) { background: var(--accent-hover); }
  .dec { background: var(--card); color: var(--danger); border-color: var(--line); }
  .dec:hover:not(:disabled) { background: var(--danger-soft); border-color: var(--danger); }

  /* Панель причины отказа — появляется вместо кнопок */
  .why { display: none; padding: 12px 22px 8px; }
  .why.open { display: block; }
  .why .lbl { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    flex: none; padding: 5px 11px; font-size: 13px; font-weight: 500; border-radius: 999px;
    background: var(--chip); color: var(--text); border-color: var(--line);
  }
  .chip:hover { border-color: var(--muted); }
  .chip.on { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  input {
    width: 100%; padding: 9px 12px; font: inherit; font-size: 14px; color: var(--text); user-select: text;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .why .row { display: flex; gap: 10px; margin-top: 10px; }
  .why .row button { padding: 10px 0; }
  .back { background: var(--card); color: var(--text); border-color: var(--line); flex: 0 0 34%; }
  .back:hover { border-color: var(--muted); }

  /* Голосование «куда идём» */
  .poll { display: none; padding: 10px 22px 6px; }
  .poll.on { display: block; }
  .plbl { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
  .win { display: none; margin-bottom: 10px; padding: 12px 14px; border-radius: 12px; font-size: 15px;
    background: var(--gold-soft); border: 1px solid var(--gold); color: var(--text); }
  .win.on { display: block; }
  .win b { font-weight: 650; }
  .win span { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .opt {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin-bottom: 6px;
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer; overflow: hidden;
    background: linear-gradient(90deg, var(--fill) var(--p), var(--card) var(--p));
    transition: border-color .15s;
  }
  .opt:hover:not(.closed) { border-color: var(--accent-line); }
  .opt.closed { cursor: default; }
  .opt.mine { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .opt.won { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .ocol { flex: 1; min-width: 0; }
  .oname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ovoters { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .oprice { flex: none; font-size: 12px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ocnt { flex: none; min-width: 14px; text-align: right; font-weight: 650; color: var(--accent); }
  .pickb { flex: none; padding: 3px 8px; font-size: 13px; font-weight: 400; border-radius: 8px;
    background: transparent; border-color: var(--line); }
  .pickb:hover { background: var(--gold-soft); border-color: var(--gold); }
  .other { display: flex; gap: 8px; }
  .other button { flex: 0 0 28%; padding: 9px 0; }

  .you { font-size: 13px; min-height: 18px; padding: 6px 22px 2px; color: var(--text-2); }
  .sum { display: flex; gap: 16px; font-size: 13px; padding: 4px 22px 10px; }
  ul { list-style: none; margin: 0; padding: 0 22px 18px; }
  li {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; margin-bottom: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  }
  li.me { border-color: var(--accent-line); }
  .who { min-width: 0; }
  .reason { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mark { font-size: 16px; font-weight: 700; width: 22px; text-align: center; flex: none; }
  .ok { color: var(--ok); } .no { color: var(--danger); } .wait { color: var(--warn); } .gone { color: var(--muted); }
  li.silent { background: transparent; color: var(--text-2); }
  li.grp { display: block; background: none; border: 0; padding: 0 2px; margin: 14px 0 6px; border-radius: 0;
    font-size: 12px; font-weight: 600; color: var(--muted); }
  li.grp:first-child { margin-top: 2px; }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 14px; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
</style>
</head>
<body>
  <div class="head"><div class="title" id="t"></div><div class="msg" id="m"></div><div class="from" id="f"></div></div>
  <div class="timer"><div id="bar"></div></div>
  <div class="left" id="left"></div>
  <div class="btns" id="btns">
    <button class="acc" id="a">Принять</button>
    <button class="dec" id="d">Отклонить</button>
  </div>
  <div class="why" id="why">
    <div class="lbl">Почему отказываешься? (можно не писать)</div>
    <div class="chips" id="chips"></div>
    <input id="reason" maxlength="80" placeholder="Своя причина…" autocomplete="off">
    <div class="row">
      <button class="back" id="back">Назад</button>
      <button class="dec" id="send">Отклонить</button>
    </div>
  </div>
  <div class="poll" id="poll">
    <div class="plbl" id="plbl"></div>
    <div class="win" id="win"></div>
    <div id="opts"></div>
    <div class="other" id="other">
      <input id="otherIn" maxlength="60" placeholder="Другое место…" autocomplete="off">
      <button class="acc" id="otherBtn">Голос</button>
    </div>
  </div>
  <div class="you" id="you"></div>
  <div class="sum"><span class="ok" id="ca"></span><span class="wait" id="cw"></span><span class="no" id="cd"></span></div>
  <ul id="list"></ul>
<script>
  let S = null, skew = 0, expired = null, chipsKey = '', closeAt = null, closeKey = '';
  const CLOSE_DELAY = 5000; // окно закрывается само через 5 с после конца таймера или когда все ответили
  const WIN_DELAY = 15000;  // после выбора места — чтобы успели прочитать
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Группы списка: приняли → молчат (получили, но не нажали) → отказались.
  // После таймера «молчат» превращаются в «не ответили».
  function renderList() {
    const groups = [
      { answer: 'accept',  title: 'Приняли',                         mark: '✓', cls: 'ok' },
      { answer: 'seen',    title: expired ? 'Не ответили' : 'Молчат', mark: expired ? '—' : '⏳', cls: expired ? 'gone' : 'wait' },
      { answer: 'decline', title: 'Отказались',                      mark: '✗', cls: 'no' },
    ];
    let html = '';
    for (const g of groups) {
      const ps = S.people.filter(p => p.answer === g.answer);
      if (!ps.length) continue;
      html += `<li class="grp">${g.title} · ${ps.length}</li>`;
      html += ps.map(p => `<li class="${p.me ? 'me' : ''} ${g.answer === 'seen' ? 'silent' : ''}">` +
        `<div class="who"><div>${esc(p.name)}${p.me ? ' (ты)' : ''}</div>` +
        (p.reason ? `<div class="reason" title="${esc(p.reason)}">${esc(p.reason)}</div>` : '') +
        `</div><span class="mark ${g.cls}">${g.mark}</span></li>`).join('');
    }
    $('list').innerHTML = html || '<div class="empty">Пока никто не ответил</div>';
    $('cw').textContent = (expired ? '— Не ответили: ' : '⏳ Молчат: ') + S.waiting;
  }

  // Голосование «куда идём»: клик по месту — это и голос, и «Принять»; голос можно
  // поменять до конца таймера. Инициатор (canPick) кнопкой 🏆 выбирает, куда идём.
  const isPoll = () => !!(S && S.options && S.options.length);
  const voteOpen = () => isPoll() && !S.winner && !expired && S.mine !== 'decline';

  // «Serbish (Пестеля 8) · 670 ₽» → ['Serbish (Пестеля 8)', '670 ₽']
  function splitPrice(s) {
    const i = s.lastIndexOf(' · ');
    return i > 0 ? [s.slice(0, i), s.slice(i + 3)] : [s, ''];
  }

  function renderPoll() {
    $('poll').classList.toggle('on', isPoll());
    if (!isPoll()) return;
    const open = voteOpen();
    $('plbl').textContent = S.winner ? 'Голосование'
      : open ? (S.canPick ? 'Куда идём? Клик — голос, 🏆 — решить'
        : S.from ? 'Куда идём? Клик по месту — голос и «Принять»'
        : 'Куда идём? Клик — голос; итог по голосам в конце')
      : S.canPick || !S.from ? 'Время вышло — выбираю по голосам…'
      : 'Голосование закрыто — ждём итог от ' + S.from;
    $('win').classList.toggle('on', !!S.winner);
    if (S.winner) {
      const [wn, wp] = splitPrice(S.winner);
      $('win').innerHTML = '🏆 Идём: <b>' + esc(wn) + '</b>' + (wp ? ' · ' + esc(wp) : '') +
        '<span>' + esc(S.winnerWhy ? S.winnerWhy : 'решил(а) ' + (S.winnerBy || 'инициатор')) + '</span>';
    } else $('win').innerHTML = '';
    const total = S.options.reduce((n, o) => n + o.voters.length, 0);
    $('opts').innerHTML = S.options.map((o, i) => {
      const p = total ? Math.round(o.voters.length / total * 100) : 0;
      const [name, price] = splitPrice(o.name);
      return `<div class="opt${o.mine ? ' mine' : ''}${S.winner === o.name ? ' won' : ''}${open ? '' : ' closed'}" data-i="${i}" style="--p:${p}%">` +
        `<div class="ocol"><div class="oname" title="${esc(o.name)}">${o.custom ? '✎ ' : ''}${esc(name)}</div>` +
        (o.voters.length ? `<div class="ovoters" title="${esc(o.voters.join(', '))}">${esc(o.voters.join(', '))}</div>` : '') +
        `</div>` + (price ? `<span class="oprice">${esc(price)}</span>` : '') +
        `<span class="ocnt">${o.voters.length || ''}</span>` +
        (S.canPick && S.winner !== o.name ? `<button class="pickb" title="Идём сюда">🏆</button>` : '') + '</div>';
    }).join('');
    $('opts').querySelectorAll('.opt').forEach(el => el.onclick = e => {
      const o = S.options[+el.dataset.i];
      if (e.target.classList.contains('pickb')) pick(o.name).then(render);
      else if (voteOpen() && !o.mine) vote(o.name);
    });
    $('other').style.display = open ? '' : 'none';
  }
  function vote(name) {
    name = name.trim();
    if (name) answer('accept', '', name).then(render);
  }
  function voteOther() {
    const v = $('otherIn').value;
    $('otherIn').value = '';
    vote(v);
  }

  // Подсказки причины — кнопки; клик подставляет текст в поле (повторный клик — очищает).
  function renderChips() {
    const rs = S.reasons || [], key = rs.join('\n');
    if (key === chipsKey) return;
    chipsKey = key;
    $('chips').innerHTML = rs.map((r, i) => `<button class="chip" data-i="${i}">${esc(r)}</button>`).join('');
    $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => {
      const r = rs[+b.dataset.i];
      $('reason').value = $('reason').value === r ? '' : r;
      syncChips(); $('reason').focus();
    });
  }
  function syncChips() {
    const v = $('reason').value.trim();
    $('chips').querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.textContent === v));
  }

  function openWhy(on) {
    $('why').classList.toggle('open', on);
    $('btns').style.display = on ? 'none' : '';
    if (on) { $('reason').value = ''; syncChips(); $('reason').focus(); }
  }

  function render(s) {
    S = s; skew = s.nowMs - Date.now();
    expired = Date.now() + skew >= s.deadlineMs;
    $('t').textContent = s.title;
    $('m').textContent = s.message || '';
    $('f').innerHTML = s.from ? 'Зовёт: <b>' + esc(s.from) + '</b>' : 'Позвала кнопка';
    $('ca').textContent = '✓ Приняли: ' + s.accepted;
    $('cd').textContent = '✗ Отказались: ' + s.declined;
    renderChips();
    renderList();
    renderPoll();
    tick();
  }

  function tick() {
    if (!S) return;
    const now = Date.now() + skew, total = S.deadlineMs - S.startMs, left = Math.max(0, S.deadlineMs - now);
    if ((left <= 0) !== expired) { expired = left <= 0; renderList(); renderPoll(); }
    $('bar').style.width = (total > 0 ? left / total * 100 : 0) + '%';

    // Автозакрытие: таймер вышел, или ты ответил и молчащих не осталось. Если кто-то
    // новый появится в «молчат» до закрытия — отсчёт сбрасывается.
    // С голосованием: у инициатора окно ждёт его выбора; после выбора места закрывается
    // у всех через WIN_DELAY (у кого окно уже закрылось — оно откроется с итогом).
    if (closeAt === Infinity) return; // закрытие уже запрошено
    const allAnswered = !!S.mine && S.waiting === 0, poll = isPoll();
    let want, key;
    if (poll && S.winner) { want = true; key = 'w:' + S.winner; }
    else if (poll && S.canPick) { want = false; key = 'pick'; }
    else { want = left <= 0 || allAnswered; key = 'n'; }
    if (key !== closeKey) { closeKey = key; closeAt = null; }
    if (!want) closeAt = null;
    else if (closeAt === null) closeAt = now + (key === 'n' ? CLOSE_DELAY : WIN_DELAY);
    if (closeAt !== null && now >= closeAt) { closeAt = Infinity; $('left').textContent = 'Закрываю…'; closeWindow(); return; }
    const closing = closeAt !== null ? ' · закроется через ' + Math.max(1, Math.ceil((closeAt - now) / 1000)) + ' с' : '';
    $('left').textContent = (poll && S.winner ? 'Место выбрано'
      : left > 0 ? (allAnswered ? 'Все ответили' : 'Осталось ' + Math.ceil(left / 1000) + ' с')
      : 'Время вышло') + closing;
    const done = !!S.mine || left <= 0;
    $('a').disabled = done; $('d').disabled = done; $('send').disabled = done;
    if (done && $('why').classList.contains('open')) openWhy(false);
    $('you').innerHTML = S.mine === 'accept' ? '<span class="ok">Ты принял</span>'
      : S.mine === 'decline' ? '<span class="no">Ты отказался</span>'
      : (left <= 0 ? 'Ты не успел ответить' : '');
  }

  function sendDecline() {
    const reason = $('reason').value.trim();
    openWhy(false);
    answer('decline', reason, '').then(render);
  }

  setInterval(tick, 250);
  $('a').onclick = () => answer('accept', '', '').then(render);
  $('otherBtn').onclick = voteOther;
  $('otherIn').addEventListener('keydown', e => { if (e.key === 'Enter') voteOther(); });
  $('d').onclick = () => openWhy(true);
  $('back').onclick = () => openWhy(false);
  $('send').onclick = sendDecline;
  $('reason').addEventListener('input', syncChips);
  $('reason').addEventListener('keydown', e => { if (e.key === 'Enter') sendDecline(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('why').classList.contains('open')) openWhy(false); else closeWindow();
  });
  getState().then(render);
</script>
</body>
</html>
